[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid


[program:postgres]
command=/bin/bash /app/docker/start-postgres.sh
autorestart=true
priority=10
stdout_logfile=/app/logs/postgres_stdout.log
stderr_logfile=/app/logs/postgres_stderr.log



[program:provider_a]
command=python -m agent_runtime.run --config agents/company_a/agent.yaml --a2a agents/company_a/a2a.yaml --port 8011 --ssl-certfile certs/local.crt --ssl-keyfile certs/local.key
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/app/logs/provider_a.stdout.log
stderr_logfile=/app/logs/provider_a.stderr.log

[program:provider_b]
command=python -m agent_runtime.run --config agents/company_b/agent.yaml --a2a agents/company_b/a2a.yaml --port 8012 --ssl-certfile certs/local.crt --ssl-keyfile certs/local.key
directory=/app
autostart=true
autorestart=true
priority=31
stdout_logfile=/app/logs/provider_b.stdout.log
stderr_logfile=/app/logs/provider_b.stderr.log

[program:registry]
command=uvicorn platform_services.registry_agent.main:app --host 0.0.0.0 --port 8020 --ssl-certfile certs/local.crt --ssl-keyfile certs/local.key
directory=/app
autostart=true
autorestart=true
priority=32
stdout_logfile=/app/logs/registry.stdout.log
stderr_logfile=/app/logs/registry.stderr.log

[program:host]
command=uvicorn platform_services.host_agent.main:app --host 0.0.0.0 --port 8030 --ssl-certfile certs/local.crt --ssl-keyfile certs/local.key
directory=/app
autostart=true
autorestart=true
priority=33
stdout_logfile=/app/logs/host.stdout.log
stderr_logfile=/app/logs/host.stderr.log

[program:demo_bootstrap]
command=/app/docker/register_providers.sh
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=80
stdout_logfile=/app/logs/demo_bootstrap.stdout.log
stderr_logfile=/app/logs/demo_bootstrap.stderr.log

[program:nginx]
command=nginx -g "daemon off;"
directory=/app
autostart=true
autorestart=true
priority=90
stdout_logfile=/app/logs/nginx.stdout.log
stderr_logfile=/app/logs/nginx.stderr.log
